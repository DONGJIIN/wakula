# 自主任务只决定“去哪里、何时移交、是否计为完成”，不生成腿部动作，不读取 Gazebo
# 名称/坐标。所有距离单位 m、角度 rad、时间 s；expected_obstacle_ids 是任务语义，不是路线。
#
# ======================== 真机调参快速入口（先读） ========================
# 先单独验收 SLAM、Nav2、感知和真实 TraverseObstacle 服务端，再启动本节点。任务层参数
# 不能修复底盘不响应、TF 漂移、点云误分类或 Action 虚假 success。
#
# 现象 -> 优先参数 -> 调整方向：
# 1. 低速真机被误判“5 秒卡死”：先确认 map 位姿真的没变；再增大 nav_stall_timeout 或
#    减小 nav_progress_translation/rotation。阈值过小会把定位噪声误当进展而永不恢复。
# 2. 同一障碍反复重试：先查清是语义、路径还是入口门限失败；再增大
#    obstacle_failure_cooldown、obstacle_revisit_cooldown/max_cooldown 或 failure_radius。
#    半径过大会屏蔽旁边的另一障碍，最大冷却过大会让真实目标过晚重试。
# 3. Nav2 停在膨胀层却不移交：核对语义和空间锁，再按真实控制器可接近距离调整
#    approach_stall_handoff_max_distance；增大它意味着越障控制器必须接管更长的低速接近。
#    绝不能为了“能动”而删除语义、横偏、航向或空间一致性守卫。
# 4. 斜着进入障碍：减小 handoff_alignment_tolerance 和 stall 最大航向误差，或增大
#    pre_alignment_trigger_angle 的灵敏度（即适当减小触发角）。过严会增加对正次数。
# 5. 长坡/桥接近时丢失同一目标：小步增大 obstacle_lock_radius/spatial_tolerance；密集障碍
#    被串成同一目标时反向减小。必须在 map 中检查两处实体间距。
# 6. 障碍名称长期不唯一：增加 verification 次数/转角或语义投票窗口；过大会原地观察更久。
#    不允许把 wooden_bridge_unknown 直接计为已完成。
# 7. Action 明明成功但不计完成：查看位移、越过入口平面和稳定窗口；按机身长度调整
#    post_traversal_minimum_displacement/beyond_margin，按定位噪声调 stable_translation/rotation。
#    放宽前先确认服务端不是“动作一开始就返回 success”。
# 8. 探索漏区域：减小 frontier_minimum_cells/coverage_goal_spacing 或增加 search turns；代价是
#    目标更多、任务更慢。frontier/coverage 参数只基于在线地图，不应加入正式场地坐标。
# 9. 无目标太早回起点：增大 maximum_search_turns/empty_frontier_confirmations；任务总时长
#    仍受 mission_timeout 限制。return_time_reserve 是其中只留给返程的窗口，不能大于总时长。
#
# 调参顺序：5 秒进展判据 -> 入口空间/航向 -> Action 成功后验 -> 冷却 -> 探索覆盖。
autonomous_mission:
  ros__parameters:
    autostart: false
    map_timeout: 2.0
    guidance_timeout: 1.0
    # 首次 map/TF 就绪后先收集约 7 帧 5 Hz 点云/图像，再允许提交第一个 Nav2 目标。
    # 相机启动慢时可增大；过大会直接占用五分钟任务预算。
    startup_sensor_settle_time: 1.50
    frontier_minimum_cells: 8
    frontier_minimum_distance: 0.55
    frontier_maximum_distance: 7.0
    frontier_exclusion_radius: 0.65
    # 导航目标不直接放在未知区边缘，而是退回已知自由区并保留局部代价地图净空。
    frontier_goal_standoff: 0.45
    frontier_goal_clearance: 0.20
    # 2D 激光可能提前把全场变成 known；前沿耗尽后继续覆盖尚未走近的自由区，保证
    # 相机和深度点云真正近距观察每项障碍。参数均为地图尺度，不含比赛坐标。
    coverage_goal_spacing: 0.60
    coverage_goal_clearance: 0.30
    coverage_visit_radius: 0.75
    coverage_record_spacing: 0.40
    # 在线地图边界可能比越障后的机体位置滞后几厘米；仅容忍小范围滞后，定位大跳变仍等待。
    map_boundary_tolerance: 0.30
    # 小于 Nav2 goal checker 容差的入口不再作为导航目标，避免“挪一下就成功”。
    # Nav2 xy_goal_tolerance=0.10 m；只跳过 0.15 m 内的伪平移目标，避免 0.15～0.35 m
    # 之间既不接近也不对正的死区。
    minimum_approach_goal_distance: 0.15
    # 小于该角度的原地旋转会被 Nav2 立即判成功；改走严格交接或语义换视角复核。
    # 略高于 Nav2 yaw_goal_tolerance=0.12 rad，确保原地目标不会被立即判成功。
    minimum_alignment_command_angle: 0.14
    # 已确认障碍先原地对准再接近：大于约 10° 才触发，每次最多修正 30°。
    # 转后等待 0.6 s 新点云，防止重复使用旋转前的旧方向数据。
    pre_alignment_trigger_angle: 0.18
    pre_alignment_max_step: 0.523599
    pre_alignment_settle_time: 0.60
    # Nav2 lifecycle 尚未 ACTIVE 时 Action 会短暂拒绝目标；退避重试而非误记为不可达。
    nav_rejection_retry_delay: 1.0
    # 规划中止/取消后留给 costmap、行为树和 SLAM 地图边界的恢复时间，避免高频重发。
    nav_failure_retry_delay: 1.0
    # 越障服务拒绝当前入口后，先交替左/右旋转换视角，而不是在同一点等待冷却后重试。
    # 角度过小可能仍看到相同侧面；过大会丢失目标并增加定位压力。真机从约 30° 起标定。
    failed_entry_turn_angle: 0.785398
    # 转向后至少等待数帧稳定点云；相机曝光较慢或点云频率低时应适当增大。
    failed_entry_settle_time: 0.80
    # 同一站位、同一航向已被 Action 拒绝时，45 秒内不允许重新交接；移动超过 0.65 m
    # 或改变约 40° 航向即可重新验证。参数只描述在线相对位姿，不含场地坐标。
    failed_entry_memory_duration: 45.0
    failed_entry_station_tolerance: 0.65
    failed_entry_heading_tolerance: 0.70
    # 完成换向后沿新机头方向请求短距离 Nav2 脱离；该阶段不获得零限速旋转旁路，仍需
    # 前向地形、急停雷达和导航健康全部许可。若真机机身更长，从 0.6 m 起逐步标定。
    failed_entry_escape_distance: 0.80
    # 严格 READY 被点云前缘抖动漏掉时的三重守卫：Nav2 已到入口、最新障碍仍是同一
    # map 位置、且距离/横偏均受限。不是“看见障碍就越”的宽松触发器。
    handoff_fallback_max_distance: 1.45
    handoff_fallback_max_lateral: 0.50
    handoff_fallback_spatial_tolerance: 0.90
    # 长桥/台阶最近前缘漂移超过 0.90 m 时，仅在机器人回到原确认观察位 0.60 m 内、
    # 航向相差不超过 0.70 rad 且粗类型兼容时恢复待办 ID。相邻障碍误关联时先减小这两项。
    handoff_fallback_viewpoint_tolerance: 0.60
    handoff_fallback_view_heading_tolerance: 0.70
    # Action 前最终航向必须在约 7° 内，不使用下面仅供停滞恢复的宽松门限。
    handoff_alignment_tolerance: 0.12
    # 坑沿/墙脚/台阶立面会被 Nav2 正确视为不可通行。入口连续 5 秒无位姿进展后，
    # 只要距离、横偏、航向和语义门限仍成立，就立即切换越障 Action，不重复原目标。
    approach_stall_handoff_count: 1
    # 若 Nav2 连续停在更远的膨胀边界，允许把“最后一段接近”也交给 TraverseObstacle。
    # Action 目标携带实测 entry_distance，真机控制器仍须自行完成低速接近和姿态闭环。
    # 2.35 m 仍位于当前 2.5 m 地形 ROI 内，并要求横偏/航向/语义/空间锁全部通过；
    # 这允许真实越障控制器接管最后一段低速接近，避免 Nav2 膨胀层停在 1.9~2.0 m 时循环。
    approach_stall_handoff_max_distance: 2.35
    approach_stall_handoff_max_lateral: 0.75
    # 停滞交接允许约 12.6°，由 Action 在 PREPARING 阶段完成最后闭环对正；真正开始
    # 抬腿仍应使用 handoff_alignment_tolerance 的严格约 7° 门限。
    approach_stall_handoff_max_heading_error: 0.22
    # 连续停滞但没有通过越障交接门限的入口先短暂让路，避免无限重试同一假目标。
    obstacle_failure_cooldown: 12.0
    obstacle_failure_radius: 0.90
    # 场地外沿斜视时会出现伪坡；目标必须位于在线 SLAM 地图外框内侧，内部障碍会随
    # 建图扩展自动满足。该值不包含正式场地尺寸或坐标。
    obstacle_map_edge_margin: 0.05
    # 宽视场同时看到台阶、坑沿和横杆时锁定已确认入口；只有同一 map 邻域的更新才允许
    # 刷新目标，避免 Nav2 每两秒在多个障碍之间取消/重发。
    # 长坡/长桥斜视时“最近前缘”会沿结构移动超过 1 m。扩大空间锁可保留远场连续
    # 坡度证据，防止近场只看到侧边便把同一目标改叫 T 台。
    obstacle_lock_radius: 1.50
    goal_timeout: 45.0
    # 包含较长坡/桥的保守上限；真机控制器仍应自行实现更短的内部超时。
    # Long competition structures (especially the segmented wooden bridge)
    # need more time than a single step.  Keep this above the longest adapter
    # duration so a valid traverse is not cancelled halfway across.
    traversal_timeout: 45.0
    # 到达入口后越障 Action 服务仍未就绪，最多原地等待 5 秒；随后保留为未完成并换目标。
    controller_wait_timeout: 5.0
    minimum_obstacle_confidence: 0.55
    obstacle_confirmation_frames: 3
    # 2.5 m 内先累计同一 map 入口的语义历史，避免坡面接近后因局部裁剪误变为台阶；
    # 只有进入 1.2 m 近场且距离/横偏/航向均通过时才能真正触发 Action。
    semantic_observation_distance: 2.50
    semantic_confirmation_distance: 1.20
    # /front_obstacle_name 已经过感知层多帧稳定与几何一致性检查，任务层再要求最近 6 帧中
    # 2 票即可锁定。若真机类别偶发串扰，先提高感知层 name_confirmation_frames；只有
    # 稳定名称仍误锁时才把这里恢复为 3，避免在同一桥面白白等待几十秒。
    # 两帧仅 0.2～0.4 s，曾把坡侧的短暂 WALL 轮廓锁成高墙；三帧仍足够快，且允许
    # sustained recent evidence 纠正旧锁。真机掉帧严重时先降低感知频率，不建议减回 2。
    semantic_confirmation_votes: 3
    semantic_recent_window: 6
    # 结构已确认但专名仍有歧义时，仅原地小角度换视角；两次仍不能确认则暂时跳过。
    # 0.30 rad 与 Nav2 最小有效旋转一致；交替视角的第三次可覆盖约 50° 的坡侧误差。
    semantic_verification_turn_angle: 0.30
    semantic_verification_max_attempts: 2
    # 换视角序列按机器人驻留点而不是会漂移的障碍前缘计数；该半径表示位姿移动多远
    # 才算真正的新观察站。过大会合并相邻观察站，过小会在同一地点重复 1/4。
    semantic_verification_lock_radius: 1.50
    # 原地换视角结束后等待至少六帧 5 Hz 深度数据，禁止使用旋转残影立即交接。
    semantic_post_turn_settle_time: 1.20
    # 只对同类别、同位置的已完成障碍去重，避免密集场地中顺带屏蔽相邻的另一类障碍。
    completed_obstacle_radius: 0.65
    post_traversal_cooldown: 3.0
    # “越障成功”采用双层证据：底层 Action 必须以 SUCCEEDED+success 返回，任务层还要
    # 从实时 map->base_link 验证机体已经越过障碍入口平面，并在落地后保持稳定。
    # 阈值不依赖 Gazebo 坐标；真机只需按机身长度、定位噪声和实际落地时间小幅标定。
    post_traversal_verification_timeout: 5.0
    post_traversal_minimum_displacement: 0.45
    post_traversal_beyond_margin: 0.12
    post_traversal_stable_duration: 0.75
    post_traversal_stable_translation: 0.06
    post_traversal_stable_rotation: 0.10
    # 多帧确认但尚未成功越过的障碍进入任务账本。空闲时优先回到当时的安全观察位置，
    # 面向障碍重新采集实时证据；绝不把 Nav2 目标直接设在实体中心。
    obstacle_revisit_position_tolerance: 0.30
    # 一次回访后给感知/地图 8 秒更新，同时允许先探索其他方向，避免在单一误检处循环。
    obstacle_revisit_cooldown: 8.0
    # 每次回访按 8/16/32/64 秒退避；到达旧观察位但没重新识别也算一次尝试。
    # 真机目标恢复后迟迟不重试可减小上限；过小会让旧记录反复抢占任务。
    obstacle_revisit_max_cooldown: 64.0
    # 无前沿不是结束条件：连续约 1 秒无候选后原地转 90° 补扫，四次补扫后重新尝试
    # 暂时失败的前沿；达到下面的补扫上限仍无新目标，才携带当前清单返回终点。
    empty_frontier_confirmations: 4
    # 每次 90°，最多补扫两圈；仍无前沿/覆盖/待办目标就返回任务启动点。
    maximum_search_turns: 8
    search_turn_angle: 1.570796
    # Nav2 Action 尚未结束但里程计位姿连续 5 秒既没有 4 cm 平移，也没有 0.06 rad 转动，
    # 视为局部停滞并取消重规划，避免表现成“自动导航走到一半自己停下”。
    nav_stall_timeout: 5.0
    # 返程只有一个终点，允许 Nav2 行为树用 20 秒执行 Spin/BackUp/重规划；普通探索仍保持
    # 5 秒快速切换。过小会在恢复动作前取消，过大则延迟真正失联的诊断。
    return_nav_stall_timeout: 20.0
    # 运动看门狗优先使用连续 /odom；0.5 s 内没有新里程计才退回 map TF。真机里程计频率
    # 低于 2 Hz 时应先修驱动，不建议增大到掩盖断流，因为导航健康节点会同步停车。
    odom_progress_timeout: 0.5
    # 现场日志中 DWB 在代价梯度内会以 0.02～0.04 m/s 做有效低速调整。旧的
    # 8 cm / 0.10 rad 窗口会把已在移动误判为卡死。新阈值仍要求 5 秒内有可见
    # 位姿变化，而不是根据“有速度命令”假定机器人真的在动。真机若定位噪声超过
    # 4 cm / 0.06 rad，应先改用带协方差的轨迹判据，不要继续降低本阈值。
    nav_progress_translation: 0.04
    nav_progress_rotation: 0.06
    # 自主导航终端每 5 秒显示一次已越过/未越过清单，清单变化时立即显示。
    inventory_log_period: 5.0
    # 总预算 300 秒，从捕获启动位姿开始计时。前 240 秒探索/越障，最后 60 秒开始返程；
    # 正在执行的越障不会被强制中断，返程遇阻也会继续安全重试而不是到点原地停车。
    mission_timeout: 300.0
    return_time_reserve: 60.0
    return_home_tolerance: 0.40
    front_name_timeout: 1.2
    expected_obstacle_ids:
      - right_angle_poles
      - gravel_wood_pit
      - height_bar
      - main_slope
      - wooden_bridge_a
      - wooden_bridge_b
      - t_shaped_stairs
      - high_wall
