obstacle_crossing_manager:
  ros__parameters:
    step_threshold: 0.08
    climb_threshold: 0.18
    stop_threshold: 0.32
    max_slope: 0.45
    max_roughness: 0.06
    min_points: 30
    sensor_timeout: 0.7
    # Escalate immediately; require this many valid frames before moving safer.
    clear_confirmation_frames: 5
    # STEP/CLIMB need consecutive depth frames; emergency STOP remains immediate.
    hazard_confirmation_frames: 3
    # Vision may only slow navigation and request depth confirmation. Geometry
    # remains the authority for STEP/CLIMB/STOP decisions.
    vision_assist_enabled: true
    vision_timeout: 0.6
    vision_min_confidence: 0.55
    vision_center_margin: 0.20
    vision_speed_scale: 0.35
crossing_action_server:
  ros__parameters:
    action_name: /crossing/traverse_obstacle
    command_topic: /crossing/execution_command
    status_topic: /crossing/execution_status
    legacy_request_topic: /crossing/action_request
    maximum_goal_timeout: 60.0
    controller_status_timeout: 1.5
    minimum_success_progress: 0.95
    require_contact_verification: true
crossing_action_coordinator:
  ros__parameters:
    action_name: /crossing/traverse_obstacle
    trigger_distance: 0.80
    observation_timeout: 0.70
    safety_timeout: 0.50
    goal_timeout: 20.0
    step_speed_scale: 0.35
    climb_speed_scale: 0.20
    clear_confirmation_frames: 3
    retry_limit: 1
    require_navigation_health: true
cmd_vel_gate:
  ros__parameters:
    input_topic: /cmd_vel_smoothed
    output_topic: /cmd_vel_terrain_safe
    command_timeout: 0.5
    decision_timeout: 0.7
    safety_timeout: 0.5
    default_speed_scale: 0.0
