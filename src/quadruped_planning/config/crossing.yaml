obstacle_crossing_manager:
  ros__parameters:
    step_threshold: 0.08
    climb_threshold: 0.18
    stop_threshold: 0.32
    max_slope: 0.45
    max_roughness: 0.06
    min_points: 30
    sensor_timeout: 0.7
    # Vision may only slow navigation and request depth confirmation. Geometry
    # remains the authority for STEP/CLIMB/STOP decisions.
    vision_assist_enabled: true
    vision_timeout: 0.6
    vision_min_area_ratio: 0.03
    vision_center_margin: 0.20
    vision_speed_scale: 0.35
cmd_vel_gate:
  ros__parameters:
    input_topic: /cmd_vel_nav
    output_topic: /cmd_vel
    command_timeout: 0.5
    default_speed_scale: 1.0
