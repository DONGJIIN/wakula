# ======================== 导航安全真机标定入口 ==========================
# 作用边界：把已标定感知转换为速度限制和入口引导；不含关节、步态或真实越障动作。
# 唯一参数源：只修改本文件。必须先完成 vision.yaml 与 terrain.yaml 的传感器标定。
#
# A. 固定调参顺序
# 感知高度等级 -> 风险/名称迟滞 -> 数据超时 -> Nav2 停车距离 -> 对正/READY -> 急停。
# 识别阈值、停车距离和 Action 接管是三类问题，禁止同时放宽来追求“先动起来”。
#
# B. 现场问题速查（现象 -> 参数 -> 调整方向/代价）
# [分类/迟滞]
# - 低台阶仍为 WALK：使 step_threshold 与 terrain.warning_height 一致，并用已知高度块验证。
#   climb/stop_threshold 只是风险标签，不代表真机跨越能力。
# - 模式跳变：增加 hazard_confirmation_frames；危险响应会变慢。恢复慢再减
#   clear_confirmation_frames，但 CLEAR/危险闪烁会增加，STOP 仍第一帧生效。
# [入口]
# - 停得太远：先核对 robot_radius/inflation/点云前缘，再减 hard_stop_distance；过小会让
#   Nav2 进入应由真实越障控制器接管的区域。
# - 到入口不 READY：检查 handoff_distance/alignment_tolerance/max_lateral_target；放宽会
#   增加斜着越障风险，优先修正外参和结构航向。
# [失效/急停]
# - 正常数据偶发超时：先修驱动和 CPU，再依据 rosbag 最大正常间隔增加 timeout；越大停车越慢。
# - 极近距离未停车：emergency_stop_distance 必须覆盖雷达盲区与制动距离；过大会阻止接近。
# - 对正时不能转：检查 DWB linear/angular，再小步调 stopped_rotation_linear_tolerance。
#
# C. 必须联动核验
# nav2 两处机身/膨胀参数、hard_stop_distance、handoff_distance、自主任务 handoff/stall
# 距离，以及真实 TraverseObstacle 控制器可接受的接近位姿。
terrain_safety_assessor:
  ros__parameters:
    # 高度分类只表示感知标签（单位 m），不是可直接执行的步态模式。
    # 与点云 warning_height 保持一致，保证 7～8 cm 低台阶不会在“识别层已报警、
    # 决策层仍当平地”的缝隙中丢失；真机值仍必须用标定块和 rosbag 重调。
    step_threshold: 0.07
    climb_threshold: 0.18
    stop_threshold: 0.32
    # 旧数组的坡度为 dz/dx，粗糙度为稳健地面残差（单位 m）。
    max_slope: 0.45
    max_roughness: 0.06
    min_points: 30
    # 全栈同机实测极端输出间隔约 2.7 s；速度门另以 0.7 s 监控，控制安全响应不受此值放慢。
    sensor_timeout: 3.0
    # 拒绝延迟/重放帧，以及时间戳明显超前于当前 ROS 时钟的帧。
    future_stamp_tolerance: 0.10
    # vision=true 时带时间戳融合消息是权威输入；vision=false 时 launch 将其关闭，
    # 节点直接读取 /terrain/features。
    prefer_fused_obstacle: true
    fused_min_confidence: 0.25
    # STOP 立即生效；较低危险与恢复到 WALK 都需要连续帧确认。
    clear_confirmation_frames: 5
    hazard_confirmation_frames: 3
    # 比赛专名需连续多帧一致才切换；清空旧障碍需要更多安全帧，避免深度缺帧造成闪烁。
    # 感知无效不经过迟滞，仍会立即显示无效并停车。
    name_confirmation_frames: 3
    name_clear_frames: 4
    # 单目视觉只能在等待深度证据时降低 WALK 速度，不能独立批准越障。
    vision_assist_enabled: true
    vision_timeout: 0.6
    vision_min_confidence: 0.55
    vision_center_margin: 0.20
    vision_speed_scale: 0.35
    # 已由点云确认的越障目标在远处保留低速，让 Nav2 到达并对正入口；进入 1.20 m
    # 交接区后归零，等待未来运动控制器接管。该参数绝不表示让 Nav2 绕开比赛障碍。
    # 1.20 m 为 0.30 m 机器人半径 + 0.45 m inflation 边界再留 0.45 m 的点云前缘
    # 漂移余量。联合运行实测 0.90 m 入口会落入膨胀代价区，DWB 在 1.4～1.6 m 处
    # 正确停车但任务层尚未交接，表现为“走到一半停下”。真机 footprint 确定后必须
    # 联动重标定 robot_radius、inflation_radius 与本参数。
    hard_stop_distance: 1.20
    hazard_approach_speed: 0.25
    # 正前方类别变化立即打印；未变化时按该周期刷新，避免终端按感知帧率刷屏。
    status_log_period: 1.0

navigation_speed_gate:
  ros__parameters:
    # Nav2 始终是速度来源；本节点执行心跳、0..1 比例限制和极近距离雷达急停后，直接
    # 发布标准 /cmd_vel。无需再串接会静默停止发布的额外速度节点。
    input_topic: /cmd_vel_smoothed
    output_topic: /cmd_vel
    command_timeout: 0.5
    assessment_timeout: 0.7
    navigation_health_timeout: 0.5
    require_navigation_health: true
    default_speed_limit: 0.0
    scan_topic: /scan
    scan_timeout: 0.5
    # 只作为最后 22 cm 的急停兜底，不参与普通障碍绕行，也不会阻止 Action 越障后端。
    emergency_stop_distance: 0.22
    emergency_sector_half_angle: 0.60
    require_emergency_scan: true
    # 进入越障入口后禁止线速度，但允许 Nav2 以有限 yaw 角速度完成机身对正；只有新鲜且
    # 有效的 TraversalGuidance ALIGN 状态能打开该权限，感知断流仍然全停。
    alignment_guidance_timeout: 0.8
    alignment_max_angular_speed: 0.30
    # DWB 的转向主导命令常为 0.10 m/s + 0.20 rad/s，而不是数学上的纯 yaw。STOP 时允许
    # 该输入进入“只保留 yaw”的门，实际输出线速度始终为零；用于转离障碍和返程恢复。
    # 值应略高于实测转向附带线速度，不能大到把普通直行误当转向。
    stopped_rotation_linear_tolerance: 0.12
    # 自主任务对 return/frontier/coverage/revisit 以及 approach/换视角目标以 4 Hz
    # 发布纯旋转恢复许可。approach 只用于消除障碍前最后几度误差；速度门会
    # 强制 linear=0，并且断流 0.8 s 自动关闭。handoff/traversal 不发布。
    rotation_recovery_timeout: 0.8

# 越障引导只发布入口目标和交接状态，不发送 NavigateToPose，也不产生任何腿部动作。
traversal_guidance:
  ros__parameters:
    input_timeout: 0.8
    approach_start_distance: 1.80
    handoff_distance: 1.20
    alignment_tolerance: 0.10
    max_lateral_target: 0.45
    approach_speed_limit: 0.25
    alignment_speed_limit: 0.12
    minimum_slope_for_handoff: 0.12
    # 同一障碍的距离/横向中心做低通；READY 需连续 3 帧，退出另设距离/角度迟滞。
    target_smoothing_alpha: 0.35
    # 进入 READY 后允许 5 cm / 约 2° 的退出迟滞，避免阈值附近阶段闪烁。
    distance_hysteresis: 0.05
    angle_hysteresis: 0.035
    ready_confirmation_frames: 3
