vision_obstacle_detector:
  ros__parameters:
    # Empty means automatically subscribe to the common ROS camera defaults.
    image_topic: ""
    image_topic_candidates: [/camera/image_raw, /camera/color/image_raw, /image_raw]
    debug_mask_topic: /vision/debug_mask
    publish_debug_mask: false
    processing_hz: 8.0
    resize_width: 640
    min_area_px: 300.0
    # Effective area is max(pixel threshold, image area * ratio).
    min_area_ratio: 0.0008
    morphology_size: 5
    edge_low_threshold: 60
    edge_high_threshold: 160
    # Use image brightness to adapt Canny while keeping the fixed values as bounds.
    adaptive_canny: true
    adaptive_canny_sigma: 0.33
    # CLAHE improves HSV/Canny stability under shadows and uneven venue lighting.
    illumination_normalization: true
    # Preserve original hue while also recovering colored regions in shadows.
    dual_illumination_color_mask: true
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    # Suppress Canny edges caused by clipped white reflections and venue lamps.
    suppress_specular_glare: true
    glare_saturation_max: 25
    glare_value_min: 245
    glare_dilation_size: 7
    # Ignore likely ceiling, robot-body and lens-border pixels.
    roi_top_ratio: 0.05
    roi_bottom_ratio: 0.95
    roi_side_margin_ratio: 0.02
    # Reject sparse color reflections inside large bounding rectangles.
    min_color_fill_ratio: 0.18
    # Reject severely under/over-exposed or blurred frames before temporal voting.
    min_image_quality: 0.35
    history_size: 5
    confirmation_frames: 3
    # The same label must also stay at a similar image position and size.
    max_temporal_center_jitter: 0.15
    max_temporal_size_jitter: 0.25
    temporal_match_ratio: 0.60
    min_temporal_iou: 0.20
    # Lock one default topic; fail over only when it has stopped publishing.
    source_switch_timeout: 2.0
    # OpenCV HSV ranges; recalibrate for the actual camera and venue lighting.
    orange_hsv_lower: [5, 80, 70]
    orange_hsv_upper: [25, 255, 255]
    blue_hsv_lower: [90, 70, 50]
    blue_hsv_upper: [135, 255, 255]
