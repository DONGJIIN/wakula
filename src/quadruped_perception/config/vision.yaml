# ========================== OpenCV 真机标定入口 ==========================
# 作用边界：视觉只输出类别辅助证据，不提供米制尺寸，也不能独立批准越障。
# 唯一参数源：只修改本文件；不要在 Python、launch 或临时 YAML 复制一套阈值。
# 完整命令、CSV 标签和验收方法：见根目录 instruction.txt 第五节。
#
# A. 标定前提
# 1. 固定曝光、增益和白平衡；确认 CameraInfo、Header 时间戳及相机安装方向正确。
# 2. 每类障碍与空场都采集正对/斜视、近/中/远、正常光/阴影/过曝/运动模糊样本；
#    真负样本必须包含地平线、蓝色杂物、队服、灯光和反光金属。
# 3. 同时观察 /vision/annotated_image；检查二值过程时临时启用 publish_debug_mask。
# 4. 每次只改下面一个参数组，用未参与调整的 bag 比较逐类 precision/recall/F1。
#
# B. 固定调参顺序
# 曝光/白平衡 -> ROI -> HSV -> 面积与结构 -> 图像质量 -> 多帧确认 -> 处理频率。
# 顺序靠前的问题未解决时，不得用放宽后续阈值掩盖。
#
# C. 现场问题速查（现象 -> 参数 -> 调整方向/代价）
# [颜色]
# - 整体漏检：重采 orange/blue_hsv_*；先扩 H，再按阴影调整 S/V。过宽会引入地板和队服。
# - 阴影漏检：保留双光照掩膜，小步提高 clahe_clip_limit；噪声/色偏增加时反向降低。
# - 强反光误检：调整 glare_* 扩大高光掩膜；白色规则结构被吃掉时反向调整。
# [结构]
# - 远处细杆漏检：降低 min_area_ratio/min_area_px；代价是小碎片误检增加。
# - 地平线冒充横杆：提高 min_bar_aspect_ratio、降低 max_bar_height_ratio 或缩窄 ROI。
# - 同排蓝色杂物冒充横杆：降低 segmented_bar_max_gap_ratio/max_gap_cv；强透视下真杆
#   漏检时反向小调。不得删除长宽、占比和蓝段规律性守卫。
# [时序/算力]
# - 标签闪烁：增加 confirmation_frames/history_size 或提高 temporal_match_ratio；相机 5 Hz
#   时每增加一帧确认约增加 0.2 s 延迟。
# - 转弯画面全被判模糊：先缩短曝光，再小步降低 min_image_quality；阈值不能补偿拖影。
# - RK3588 延迟累积：先减 resize_width/processing_hz，再关闭调试图；不要增大订阅队列。
# - 融合失败：先统一相机/点云时钟，再按 time_skew 分布调整 fusion.sync_slop；窗口过大
#   会把机器人运动前后的两个物体错配。
#
# D. 相机—点云空间关联边界（真机必读）
# 当前版本尚未订阅 CameraInfo，也没有使用标定外参把点云投影到图像，因此 OpenCV
# 只能确认点云已经给出的同一类别；即使净空/宽度看起来匹配，也禁止把 STEP 改成
# BAR/POLE。vision_center_margin 只是归一化像素走廊的粗筛，不是内外参标定，任何
# 取值都不会开启跨类别细分。
# 未来真机若要开启细分，必须同时具备：相机内参 CameraInfo、相机到点云坐标系的
# 静态外参 TF、按原始 Header 时刻查 TF、投影点与视觉框的重叠/深度门控。完成棋盘格
# 内参标定和相机—雷达联合外参标定后，用未参与调参的动态 rosbag 验收空间误配率，
# 然后再单独引入投影关联开关；不得通过放宽 sync_slop/vision_center_margin 代替标定。
vision_obstacle_detector:
  ros__parameters:
    # ---------- 输入、输出与算力上限 ----------
    # 为空时自动订阅常见 ROS 相机默认话题，并只锁定一个活跃来源。
    image_topic: ""
    image_topic_candidates: [/camera/image_raw, /camera/color/image_raw, /image_raw]
    debug_mask_topic: /vision/debug_mask
    publish_debug_mask: false
    # RViz 默认显示带 ROI、单帧候选、多帧确认框和图像质量的调试画面。
    # 该输出不参与决策；无显示器部署可关闭以减少一次图像复制和编码。
    annotated_image_topic: /vision/annotated_image
    publish_annotated_image: true
    # RK3588 在线档：5 Hz 足够覆盖低速导航的多帧确认；576 px 保留细杆结构，同时比
    # 640 px 少约 19% 像素。离线 rosbag 标定可临时提高频率或关闭缩放做准确率对照。
    processing_hz: 5.0
    resize_width: 576

    # ---------- 轮廓面积与形态学去噪 ----------
    min_area_px: 300.0
    # 有效面积阈值取固定像素值和“图像面积×比例”中的较大值。
    min_area_ratio: 0.0008
    morphology_size: 5
    edge_low_threshold: 60
    edge_high_threshold: 160
    # ---------- 光照与边缘鲁棒性 ----------
    # 根据图像亮度自适应 Canny；上面的固定值仍作为安全边界。
    adaptive_canny: true
    adaptive_canny_sigma: 0.33
    # CLAHE 改善阴影及场馆明暗不均时 HSV/Canny 的稳定性。
    illumination_normalization: true
    # 同时使用原图和增强图颜色掩膜：保留原始色相，又恢复阴影中的色块。
    dual_illumination_color_mask: true
    clahe_clip_limit: 2.0
    clahe_grid_size: 8
    # 抑制白色强反光和场馆灯具造成的伪 Canny 边缘。
    suppress_specular_glare: true
    glare_saturation_max: 25
    glare_value_min: 245
    glare_dilation_size: 7
    # ---------- 有效画面区域与质量门控 ----------
    # 忽略大概率属于天花板、机身和镜头边缘的像素。
    roi_top_ratio: 0.05
    roi_bottom_ratio: 0.95
    roi_side_margin_ratio: 0.02
    # 大矩形内部颜色过稀疏时视为反光而非实体色块。
    min_color_fill_ratio: 0.18
    # 限高横杆必须细长且不能贴满画面。后两项会排除地平线、坡面边缘及整片地板颜色
    # 形成的超宽/超高框；更换相机视场后用标定 rosbag 调整，不要直接删除边界门控。
    min_bar_aspect_ratio: 3.0
    max_bar_width_ratio: 0.85
    max_bar_height_ratio: 0.22
    # 蓝白横杆必须由间距近似重复的蓝段组成。max_gap_ratio 约束最大空隙相对蓝段中位宽，
    # max_gap_cv 约束各空隙离散程度；误把一排蓝色杂物当横杆时降低，强透视下真杆漏检时
    # 小步提高并用标注图确认。两者只影响视觉辅助，米制净空仍由点云决定。
    segmented_bar_max_gap_ratio: 2.5
    segmented_bar_max_gap_cv: 0.55
    # 严重欠曝、过曝或模糊帧在进入时序投票前即被拒绝。
    min_image_quality: 0.35

    # ---------- 多帧确认：压制单帧反光、运动模糊和检测框跳变 ----------
    history_size: 5
    confirmation_frames: 3
    # 同一类别还必须保持近似位置、尺寸与 IoU，不能只靠标签一致。
    max_temporal_center_jitter: 0.15
    max_temporal_size_jitter: 0.25
    temporal_match_ratio: 0.60
    min_temporal_iou: 0.20
    # 超过此帧间隔即清空旧投票；相机恢复后必须重新积累 confirmation_frames。
    history_reset_timeout: 0.75
    # 当前来源失联达到此时间后才允许其他候选话题接管。
    source_switch_timeout: 2.0
    # 元数据合法但 cv_bridge 无法转换实际像素时隔离该来源。备用相机可立即接管；只有
    # 一个相机时在冷却结束后自动重试。调小可加快驱动恢复，过小会让坏编码高频反复抢占。
    source_failure_cooldown: 2.0
    # 与下游 NavigationSafety 的未来时间戳合同一致；超过 100 ms 应修复相机时钟同步，
    # 不能靠放宽容差让未来帧持续占用来源锁。
    source_future_tolerance: 0.10
    # ---------- 场地颜色标定 ----------
    # OpenCV HSV 范围；必须针对实际相机、曝光和比赛场馆用 rosbag 重新标定。
    orange_hsv_lower: [5, 80, 70]
    orange_hsv_upper: [25, 255, 255]
    blue_hsv_lower: [90, 70, 50]
    blue_hsv_upper: [135, 255, 255]

perception_fusion:
  ros__parameters:
    # 相机与点云采样时间的最大允许差；只按 Header 时间戳配对。先用 bag 统计正常时差的
    # 99% 分位，再留少量抖动余量；减小可降低运动错配，增大会提高不同帧/不同障碍误配风险。
    sync_slop: 0.10
    # 每路最多缓存的消息数，配对成本约为 queue_size^2。只有驱动突发乱序且有效配对被
    # 淘汰时才增大；RK3588 延迟或内存升高时减小，不得用大队列补偿错误传感器时钟。
    queue_size: 10
    # 只影响“同类视觉确认”的准入门限。真机先固定曝光/白平衡，用独立验证 bag
    # 按 precision-recall 选择；降低会增加误确认，且绝不会授权视觉改写点云类别。
    vision_min_confidence: 0.55
    # 视觉框必须与归一化前向走廊相交，仅用于排除明显的画面边缘物体。更换相机
    # 视场/裁剪后，用标注图像调到覆盖点云前向 ROI 的像素区域；值越大走廊越窄，边缘
    # 误关联更少但斜视漏确认更多。该值不能代替 CameraInfo/外参/投影空间门。
    vision_center_margin: 0.15
    # 相机断流时等待短窗口后发布纯点云结果，避免视觉辅助阻断几何安全链。它应略大于
    # sync_slop；减小可更快降级，增大可等候网络抖动但会延迟点云安全结果。
    terrain_only_timeout: 0.25
