terrain_analyzer:
  ros__parameters:
    input_topic: ""
    input_topic_candidates: [/camera/depth/points, /camera/depth/color/points, /camera/points, /points]
    target_frame: base_link
    processing_hz: 10.0
    transform_timeout: 0.05
    max_points: 30000
    # Downsampled base_link cloud used by the Nav2 local obstacle layer.
    nav2_cloud_max_points: 5000
    front_x_min: 0.10
    front_x_max: 1.50
    lateral_half_width: 0.45
    ground_percentile: 0.10
    warning_height: 0.12
    critical_height: 0.28
    max_slope: 0.45
    max_roughness: 0.06
    min_valid_points: 30
    source_switch_timeout: 2.0
    # 高度图地面分割；不同深度相机只需用 rosbag 调这组参数。
    grid_cell_size: 0.05
    ground_height_bin: 0.03
    pit_depth_threshold: 0.08
    wall_height_threshold: 0.25
    # Reject isolated depth speckles: hazards must form an 8-connected XY region.
    min_connected_region_cells: 3
