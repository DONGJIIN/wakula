# 点云几何是真实高度、坑深、坡度和净空的主要证据。所有空间参数单位为 m，坐标统一到
# base_link（x 前、y 左、z 上）；坡度输出在消息中为角度，旧数组 max_slope 为 dz/dx。
#
# ======================== 真机调参快速入口（先读） ========================
# 在改阈值前，先用 RViz 验证 base_link -> 传感器 TF、点云单位和地面方向。外参高度偏差
# 会同时伪造台阶、坑洞和坡度，不能靠分别修改三个类别阈值补偿。
#
# 现象 -> 优先参数 -> 调整方向：
# 1. 看不到脚前近处：减小 front_x_min、检查相机近盲区/俯角；过小会把机身和前腿纳入。
# 2. 障碍太晚出现：增大 front_x_max；必须同时确认深度在该距离仍可靠，且 CPU 可承受。
# 3. 左右边缘误检/漏检：调 lateral_half_width；宽于机体通道会把旁侧障碍当正前方。
# 4. 平地总报台阶：先修 TF/地面拟合，再增大 ground_height_bin 或 warning_height；调高
#    warning_height 会漏掉低台阶，必须用已知 5/7/10 cm 标定块验证。
# 5. 低台阶漏检：小步降低 warning_height/nav2_obstacle_min_height_above_ground，或减小
#    grid_cell_size；噪点风险和计算量会上升，需同时检查连通区回波数量。
# 6. 坑洞误报：增大 pit_depth_threshold、min_connected_region_cells/points；真实浅坑漏检
#    时反向调，并验证坑底确实有回波。无回波不等于可可靠测得坑深。
# 7. 墙/高台被当普通台阶：降低 wall_height_threshold；深度飞点导致假墙时提高它及连通门。
# 8. 横杆漏检：先确认点云能看到杆底，再降低 bar_min_clearance；该值过低会把普通凸起
#    当悬空杆。RGB 只能辅助名称，不能补出缺失深度。
# 9. 坡面被 Nav2 标成墙：先修地面平面与外参，再提高地面吸收带；不要在 costmap 删除点云。
# 10. CPU 高/延迟：依次降低 transform_max_points、max_points、processing_hz；离线对比准确率
#     后再定。nav2_cloud_max_points 只影响发布给 costmap 的稀疏程度。
#
# 调参顺序：TF/时间 -> ROI -> 地面 -> 台阶/坑/墙/杆 -> 连通区 -> 点数与频率。
terrain_analyzer:
  ros__parameters:
    # ---------- 输入、坐标系与算力上限 ----------
    # input_topic 为空时按候选顺序锁定首个活跃 PointCloud2；不同时处理多路点云。
    input_topic: ""
    input_topic_candidates: [/camera/depth/points, /camera/depth/color/points, /camera/points, /points]
    target_frame: base_link
    # 5 Hz 已快于当前上层地形决策所需频率；只处理最新帧，避免与 SLAM/RViz 抢占 CPU。
    processing_hz: 5.0
    transform_timeout: 0.05
    # 先对原始高分辨率点云做全幅等间隔采样，再执行 TF；<=0 可关闭以做离线精度对照。
    transform_max_points: 40000
    # 节点只处理最新帧；max_points 限制几何计算量，避免高线数雷达拖慢 RK3588。
    max_points: 12000
    # 发布给 Nav2 局部代价地图的 base_link 降采样障碍点数上限。
    nav2_cloud_max_points: 1800
    # 先按拟合地面平面计算相对高度，只把高于地面 5 cm 的点送入 Nav2；避免坡面误标障。
    nav2_obstacle_min_height_above_ground: 0.05

    # ---------- 机器人前方检测区域（单位 m） ----------
    front_x_min: 0.10
    # 2.5 m 让终端在低速接近障碍时提前给出名称；不是全场物体列表。
    front_x_max: 2.50
    lateral_half_width: 0.55
    # 丢弃深度驱动以极大有限值表示的无回波点。范围相对 base_link，真机按传感器
    # 安装高度和最高可见障碍调整；当前比赛结构均位于该窗口内。
    front_z_min: -1.00
    front_z_max: 2.00

    # ---------- 旧特征接口与通行性阈值 ----------
    ground_percentile: 0.10
    # 比赛最低一级台阶约 0.10 m；采用 0.07 m 几何门可容纳约 2 cm 深度/外参误差，
    # 同时仍高于 0.04 m 地面吸收带，并受连续栅格与原始回波双重支撑约束。
    warning_height: 0.07
    critical_height: 0.28
    max_slope: 0.45
    max_roughness: 0.06
    min_valid_points: 30
    source_switch_timeout: 2.0

    # ---------- 高度图地面分割与障碍分类 ----------
    # 不同深度相机/3D 雷达优先使用 rosbag 调整这组参数。
    grid_cell_size: 0.05
    ground_height_bin: 0.03
    # 规则坑深约 0.10 m、高墙约 0.30 m。阈值分别预留 2～3 cm 测量余量；单个低点或
    # 高点不会触发，因为后面还要求连续区域和最少原始回波。
    pit_depth_threshold: 0.07
    wall_height_threshold: 0.23
    # 横杆底部预期约 0.30 m；此值留出深度噪声和外参误差余量。
    bar_min_clearance: 0.18
    # 危险区域必须在 XY 高度图中形成 8 邻域连通块，以过滤孤立飞点。
    min_connected_region_cells: 4
    # 连通块还必须有足够原始回波，防止一小团聚集飞点被误认为真实障碍。
    min_connected_region_points: 16
