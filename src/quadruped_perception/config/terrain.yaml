# ========================== 点云真机标定入口 ============================
# 作用边界：点云是高度、坑深、坡度和净空的米制主证据；不生成足端或关节动作。
# 坐标/单位：base_link（x 前、y 左、z 上），长度 m；强类型坡角 rad，旧数组坡度 dz/dx。
# 唯一参数源：只修改本文件；完整采集、真值记录和验收方法见 instruction.txt 第五节。
#
# A. 标定前提
# 1. 先验证点云单位、Header、sensor_frame -> base_link TF 和静态平地方向。外参错误会同时
#    伪造台阶、坑和坡，禁止靠分别放宽三个类别阈值补偿。
# 2. 使用卷尺/角度仪记录真值，采集平地、5/7/10 cm 台阶、不同坡度、可见坑底、墙、
#    横杆、立柱以及黑色/反光/无回波负样本。
# 3. 每次只改一个参数组，用 TerrainFeatures 的米制字段和独立验证 bag 复核。
#
# B. 固定调参顺序
# TF/时间/单位 -> ROI -> 地面模型 -> 台阶/坑/墙/杆 -> 连通回波 -> 点数与频率。
#
# C. 现场问题速查（现象 -> 参数 -> 调整方向/代价）
# [ROI]
# - 脚前盲区：减小 front_x_min 并检查近盲区/俯角；过小会纳入机身和前腿。
# - 障碍出现太晚：增大 front_x_max；必须同时确认远距深度仍可靠且 CPU 可承受。
# - 旁侧误报：减小 lateral_half_width；过小会漏掉机身通道边缘。
# [地面与类别]
# - 平地报台阶：先修 TF/地面，再增 ground_height_bin 或 warning_height；后者会漏低台阶。
# - 低台阶漏检：降低 warning_height/nav2_obstacle_min_height_above_ground 或 grid_cell_size；
#   代价是噪点和计算量上升，必须复核连通回波。
# - 坑误报：增 pit_depth_threshold 或连通门；真浅坑漏检时反向调，且必须实际看到坑底回波。
# - 墙被报台阶：降低 wall_height_threshold；飞点假墙时提高它及连通门。
# - 横杆漏检：先确认点云看到杆底，再降低 bar_min_clearance；过低会把普通凸起当悬空杆。
# - 坡面被 Nav2 标墙：先修外参/平面，再调地面吸收带；不得从 costmap 删除点云层。
# [算力]
# - RK3588 延迟：依次降低 transform_max_points、max_points、processing_hz；每一步都要比较
#   分类召回率和米制误差。nav2_cloud_max_points 只控制代价地图发布稀疏度。
terrain_analyzer:
  ros__parameters:
    # ---------- 输入、坐标系与算力上限 ----------
    # input_topic 为空时按候选顺序锁定首个活跃 PointCloud2；不同时处理多路点云。
    input_topic: ""
    input_topic_candidates: [/camera/depth/points, /camera/depth/color/points, /camera/points, /points]
    target_frame: base_link
    # 5 Hz 已快于当前上层地形决策所需频率；只处理最新帧，避免与 SLAM/RViz 抢占 CPU。
    processing_hz: 5.0
    transform_timeout: 0.05
    # 先对原始高分辨率点云做全幅等间隔采样，再执行 TF；<=0 可关闭以做离线精度对照。
    transform_max_points: 40000
    # 节点只处理最新帧；max_points 限制几何计算量，避免高线数雷达拖慢 RK3588。
    max_points: 12000
    # 发布给 Nav2 局部代价地图的 base_link 降采样障碍点数上限。
    nav2_cloud_max_points: 1800
    # 先按拟合地面平面计算相对高度，只把高于地面 5 cm 的点送入 Nav2；避免坡面误标障。
    nav2_obstacle_min_height_above_ground: 0.05

    # ---------- 机器人前方检测区域（单位 m） ----------
    front_x_min: 0.10
    # 2.5 m 让终端在低速接近障碍时提前给出名称；不是全场物体列表。
    front_x_max: 2.50
    lateral_half_width: 0.55
    # 丢弃深度驱动以极大有限值表示的无回波点。范围相对 base_link，真机按传感器
    # 安装高度和最高可见障碍调整；当前比赛结构均位于该窗口内。
    front_z_min: -1.00
    front_z_max: 2.00

    # ---------- 旧特征接口与通行性阈值 ----------
    ground_percentile: 0.10
    # 比赛最低一级台阶约 0.10 m；采用 0.07 m 几何门可容纳约 2 cm 深度/外参误差，
    # 同时仍高于 0.04 m 地面吸收带，并受连续栅格与原始回波双重支撑约束。
    warning_height: 0.07
    critical_height: 0.28
    max_slope: 0.45
    max_roughness: 0.06
    min_valid_points: 30
    source_switch_timeout: 2.0
    # 某候选点云能发布消息但无法解码 XYZ 或缺少 TF 时，将该话题暂时隔离，让健康备用源
    # 接管；只有一个传感器时冷却结束会自动重试。过短会在故障源间抖动，过长会延迟恢复。
    source_failure_cooldown: 2.0
    # 与下游 NavigationSafety 的未来时间戳合同一致。若驱动时间领先超过 100 ms，应校准
    # 传感器/PTP/NTP 时钟，不能放宽本门限，否则坏源会保持所有权而下游持续拒绝其结果。
    source_future_tolerance: 0.10
    # XYZ/TF 正常但前向 ROI 点数不足或几何仍为 UNKNOWN 时，连续多少个已处理帧后才把
    # 当前源隔离。5 帧在 5 Hz 下约为 1 s：调小可更快切备用源，但机身俯仰/短时遮挡更易
    # 误切；调大可容忍更长遮挡，但故障相机/雷达会更久压住健康备用源。禁止设为 1，避免
    # 单帧无回波造成来源抖动。
    source_geometry_failure_frames: 5
    # 地面高度先验只用于短时遮挡。超过年龄或连续发现“整片可见平面与先验整体平移”时，
    # 先输出 UNKNOWN，再丢弃先验重新获取，避免调节机身高度后永久误报 PIT。max_height_shift
    # 应高于平地外参/步态抖动的 99% 分位；调小会频繁重取地面，调大会延长错误先验寿命。
    ground_prior_max_age: 3.0
    ground_prior_max_consecutive_conflicts: 3
    ground_prior_max_height_shift: 0.10

    # ---------- 高度图地面分割与障碍分类 ----------
    # 不同深度相机/3D 雷达优先使用 rosbag 调整这组参数。
    grid_cell_size: 0.05
    ground_height_bin: 0.03
    # 规则坑深约 0.10 m、高墙约 0.30 m。阈值分别预留 2～3 cm 测量余量；单个低点或
    # 高点不会触发，因为后面还要求连续区域和最少原始回波。
    pit_depth_threshold: 0.07
    wall_height_threshold: 0.23
    # 横杆底部预期约 0.30 m；此值留出深度噪声和外参误差余量。
    bar_min_clearance: 0.18
    # 危险区域必须在 XY 高度图中形成 8 邻域连通块，以过滤孤立飞点。
    min_connected_region_cells: 4
    # 连通块还必须有足够原始回波，防止一小团聚集飞点被误认为真实障碍。
    min_connected_region_points: 16

    # ---------- CLEAR 连续可见地面合同（防止把无回波坑/场地边缘当平地） ----------
    # 只有机器人中央通道从 start_x 到 required_distance 都获得足够横向地面回波，且
    # 任一连续缺带不超过 max_gap，才允许发布 CLEAR。识别出障碍时同样检查“配置前视距离”
    # 与“其前缘前一格”两者较近处之前的 approach corridor，避免隔着无回波坑/黑色区域
    # 接近远处障碍。缺带只表示 UNKNOWN/停车，不凭空判 PIT；障碍本体占用的栅格不要求
    # 同时看到地面。
    # 真机先按机身最宽处（含定位/摆动余量）设置 half_width，再用平地与黑色/反光无回波 bag
    # 调整 required_distance/max_gap。减小 max_gap 更安全但会增加弱纹理地面误停；不得为了
    # 消除误停把它增大到足以跨过比赛坑洞或场地边缘。
    clear_ground_corridor_half_width: 0.25
    # start_x 是“机器人前缘与传感器近场盲区”两者较远处的 base_link x 坐标，不是任意
    # 放宽项。Gazebo 相机安装在 x=0.52 m、z=0.42 m，首个稳定地面回波约在 x=1.04 m；
    # 0.90 m 起点配合 0.15 m 缺带容差覆盖该光学盲区。真机必须用平地 rosbag 实测首个
    # 稳定地面回波，并确保 start_x 不小于机身/前腿的最前安全边界。
    clear_ground_start_x: 0.90
    # 这是 base_link 下的绝对前向终点；当前实际验证区间为 0.90～1.70 m（长 0.80 m）。
    # 增大可更早发现坑/黑色无回波，但远距深度稀疏会增加 UNKNOWN；减小则缩短停车余量。
    clear_ground_required_distance: 1.70
    clear_ground_max_gap: 0.15
    # 每个纵向栅格至少要覆盖中央通道横向栅格数的该比例，避免一条侧边回波冒充整条地面。
    clear_ground_min_lateral_fraction: 0.25
