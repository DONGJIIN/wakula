system_safety_supervisor:
  ros__parameters:
    # Preliminary software limits. Replace with measured platform limits.
    max_roll: 0.70
    max_pitch: 0.70
    # Hardware-neutral until the battery series count is chosen.
    minimum_battery_voltage: 0.0
    sensor_timeout: 1.0
    # Keep false before hardware exists. Set true one by one during bringup.
    require_imu: false
    require_joint_states: false
    require_battery: false
    # 真机验收时设为 true；模拟硬件和厂商 Adapter 都发布 /hardware/status。
    require_hardware_status: false
    max_abs_joint_position: 6.4
mock_sdk_adapter:
  ros__parameters:
    step_duration: 2.0
    climb_duration: 4.0
    low_profile_duration: 3.0
    initial_fault: none
