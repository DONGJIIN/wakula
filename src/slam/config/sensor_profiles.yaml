# 设备名只是常见话题的便捷预设。算法侧合同仍固定为 /scan、/odom、
# sensor_msgs/Image 和 sensor_msgs/PointCloud2；profile 不安装或启动任何厂家驱动。
profiles:
  ros_default:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: ""

  # 这些 2D 雷达的大多数 ROS 2 驱动本身就发布标准 /scan。
  rplidar:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: ""
  ydlidar:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: ""
  ldlidar:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: ""
  hokuyo:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: ""

  # 相机命名空间会随驱动启动参数变化；显式 launch 覆盖始终优先于这里的常见初值。
  realsense_d400:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: /camera/camera/color/image_raw
    point_cloud_topic: /camera/camera/depth/color/points
  orbbec_gemini2:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: /camera/color/image_raw
    point_cloud_topic: /camera/depth/points
  zed2:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: /zed/zed_node/rgb/color/rect/image
    point_cloud_topic: /zed/zed_node/point_cloud/cloud_registered
  oak_d:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: /oak/rgb/image_raw
    point_cloud_topic: /oak/stereo/points

  # 3D 雷达 profile 只接入地形分析/局部代价地图 PointCloud2。当前 2D SLAM 仍需独立
  # LaserScan，可由 2D 雷达或 pointcloud_to_laserscan 提供。
  velodyne:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: /velodyne_points
  ouster:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: /ouster/points
  livox:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: /livox/lidar
  hesai:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: /lidar_points
  robosense:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: /rslidar_points
  lslidar:
    scan_topic: /scan
    odom_topic: /odom
    camera_topic: ""
    point_cloud_topic: /lslidar_point_cloud
