# SLAM Toolbox 在线异步建图基线。真实部署前必须按雷达量程、/odom 噪声和比赛场地 rosbag
# 调参；本文件不会生成里程计，odom -> base_link 必须由外部状态估计提供。
#
# ======================== 真机调参快速入口（先读） ========================
# 单位：距离=m，角度=rad，时间=s。先确认 /scan、/odom、TF 和时间戳正确，再调算法；
# 雷达装歪、odom 漂移或时间不同步不能靠放宽匹配阈值修复。
#
# 现象 -> 优先参数 -> 调整方向：
# 1. 雷达报 range 能力不匹配：max_laser_range = min(可靠实测距离, LaserScan.range_max)。
#    不要填写宣传页最大量程；黑色材料/斜入射仍稳定返回的距离才算可靠。
# 2. 转圈/倒退时地图跟不上：先查 TF 与 CPU；再将 minimum_time_interval 逐步减小
#    （0.10 -> 0.08 -> 0.067）。越小匹配更及时，但 RK3588 CPU 和队列压力更大。
# 3. 地图更新看起来慢但机器人定位正常：减小 map_update_interval；它只影响栅格显示，
#    不提高扫描匹配频率。不要用它解决 map->odom 滞后。
# 4. 静止时墙体变厚/重影：先修 odom 和外参；再适当增大 minimum_travel_distance、
#    minimum_travel_heading。增得过大会让低速倒退和小角度旋转不建图。
# 5. 真实回环没闭合：在标注 rosbag 上小步降低 loop_match_minimum_response_*；若错误
#    拉扯地图则反向提高，并缩小 loop_search_maximum_distance。每次只改一项。
# 6. CPU 高/scan queue full：增大 minimum_time_interval，必要时减小 scan_buffer_size；
#    不要同时放大 correlation/loop 搜索窗口。scan_queue_size 只吸收短时 TF/调度抖动。
# 7. 细障碍地图轮廓太粗：resolution 0.05 -> 0.04；内存/CPU 会近似按面积快速增加。
#
# 建议标定顺序：量程 -> TF/时间 -> 直行/倒退 -> 连续旋转 -> 闭环 -> 分辨率/算力。
slam_toolbox:
  ros__parameters:
    use_sim_time: false
    mode: mapping

    # ---------- 标准 ROS 导航坐标系与激光输入 ----------
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: /scan

    # ---------- 地图更新、TF 与计算频率 ----------
    resolution: 0.05
    # 比赛场地为 14 m × 6 m，12 m 已覆盖有效建图距离，并与仿真/推荐真机雷达合同一致。
    # 不要把该值设得高于传感器 range_max，否则 SLAM Toolbox 会发出能力不匹配警告。
    max_laser_range: 12.0
    # 15 Hz 雷达最快约每 0.067 s 一帧。限制为 0.10 s 可把倒退/转向扫描匹配提高到
    # 约 10 Hz，同时仍主动丢弃过密帧，避免 RK3588 因追赶历史扫描而产生越来越大的延迟。
    minimum_time_interval: 0.1
    # SLAM Toolbox 的异步节点默认只保留 1 帧等待 TF 的扫描；CPU 短时繁忙时会因此
    # 直接出现 queue full。5 帧在 15 Hz 雷达下最多覆盖约 0.33 s，足以吸收调度抖动，
    # 又不会形成明显的旧扫描积压。它和下方用于回环匹配的 scan_buffer_size 含义不同。
    scan_queue_size: 5
    transform_publish_period: 0.05
    # 0.25 s 即 4 Hz 地图发布；在 0.5 m/s 时可视位移约 0.125 m。它只提高 OccupancyGrid
    # 刷新频率，实时定位仍由上面的扫描匹配和 20 Hz map->odom TF 负责。
    map_update_interval: 0.25
    transform_timeout: 0.2
    tf_buffer_duration: 30.0

    # ---------- 扫描匹配和关键帧选择 ----------
    use_scan_matching: true
    use_scan_barycenter: true
    # 关键帧阈值降低到 8 cm / 0.08 rad（约 4.6°），避免倒退或原地旋转时必须等到
    # 明显位移后才纳入新扫描；仍保留阈值以抑制静止雷达噪声和无意义的 CPU 消耗。
    minimum_travel_distance: 0.08
    minimum_travel_heading: 0.08
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 10.0
    # 匹配响应越高要求越严格；过低易错误闭环，过高可能错过真实闭环。
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 1.5
    loop_search_maximum_distance: 3.0
    do_loop_closing: true
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45

    # ---------- 相关搜索窗口与评分惩罚 ----------
    # 搜索窗口越大越能容忍初值误差，但 CPU 开销和错误匹配风险也越高。
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
