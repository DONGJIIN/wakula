# Wakula 的保守 Nav2 基线。所有速度和机器人尺寸都是未标定初值，真机只能在低速、
# 有保护条件下根据实测能力调整。速度话题完整链路见 connect.txt。
#
# ======================== 真机调参快速入口（先读） ========================
# 本文件包含多个 Nav2 节点，同一个物理量可能必须同步修改，禁止只改其中一处：
# - 外形：local_costmap.robot_radius 与 global_costmap.robot_radius 必须一致；真机轮廓
#   确定后优先换成 footprint。inflation_radius 是额外安全层，不包含机身半径。
# - 速度：FollowPath 的 max/min/acc/decel 与 velocity_smoother 对应数组必须一致；最终
#   /cmd_vel 还会被 terrain_navigation.yaml 限速，看到速度低不一定是 DWB 参数问题。
# - 越障入口：robot_radius、两处 inflation_radius、terrain_navigation.yaml 的
#   hard_stop_distance/handoff_distance、autonomous_mission.yaml 的停滞交接距离要联动实测。
#
# 现象 -> 优先参数 -> 调整方向：
# 1. 贴墙/擦碰：先增大实测 footprint/robot_radius，再小步增大 inflation_radius；代价是
#    窄通道更难规划。若模型外形错误，禁止只靠无限增大 inflation 掩盖。
# 2. 窄通道明明能过却无路径：先核对 footprint 和点云假障碍；确认有真实净空后再每次
#    0.05 m 减小 inflation_radius。不要删除 obstacle_layer 来“让越障通过”。
# 3. 路径振荡/左右摆：先降低 max_vel_x、max_vel_theta 和加速度；再检查 GoalAlign/
#    PathAlign 权重。一次只改一个 critic，保留 rosbag 和 /cmd_vel 日志对比。
# 4. 跟踪反应慢：在 CPU 有余量时提高 controller_frequency 或 vx/vtheta_samples；若控制
#    周期超时则反向降低采样。sim_time 越大看得远，但窄场景更保守且计算更重。
# 5. 到目标附近转不停：适当增大 xy/yaw_goal_tolerance；过大会导致障碍入口未对正便成功。
#    yaw_goal_tolerance 应与 autonomous_mission 的 handoff_alignment_tolerance 联动。
# 6. TF extrapolation：先修驱动时间戳/时钟，再小步增加 transform_tolerance；放宽容差不能
#    修复持续时钟偏差，只会让控制使用更旧位姿。
# 7. 动态障碍残留：核对 scan clearing 和 raytrace_max_range > obstacle_max_range；点云层
#    故意 marking-only，避免稀疏 RGB-D 错误清除 2D 雷达障碍。
# 8. “5 秒就取消”来自 autonomous_mission.yaml 的 nav_stall_timeout，早于本文件
#    progress_checker 的 15 s；若真机极低速，应联动降低进展阈值或增加任务层超时。
#
# 首次真机只用低速：先外形/急停，再直线/旋转动力学，再局部地图，最后才调 critic。

# ---------- 局部路径跟踪：全局路径 -> /cmd_vel_nav ----------
controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    cmd_vel_topic: /cmd_vel_nav
    enable_stamped_cmd_vel: false
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    progress_checker_plugins: ["progress_checker"]
    goal_checker_plugins: ["goal_checker"]
    controller_plugins: ["FollowPath"]
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      # 15 s 内移动不足 0.25 m 视为受困，触发行为空间中的恢复流程。
      required_movement_radius: 0.25
      movement_time_allowance: 15.0
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      # 越障入口交接距离为 0.90 m；10 cm 目标容差既给未标定真机留余量，也避免在
      # 接近入口时反复提交几厘米的伪目标。越障交接由任务层和 Action 完成。
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.12
      stateful: true
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      min_vel_x: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 0.8
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 0.5
      acc_lim_y: 0.0
      acc_lim_theta: 1.0
      # 减速度在 Nav2 中使用负数表示允许速度向零方向变化。
      decel_lim_x: -0.5
      decel_lim_y: 0.0
      decel_lim_theta: -1.0
      # 16×18 候选比 20×20 少 28% 轨迹评分量；低速四足仍保留足够转向分辨率。
      # 真机若能高速运动，应基于闭环日志提高采样，而不是盲目复制轮式底盘默认值。
      vx_samples: 16
      vy_samples: 1
      vtheta_samples: 18
      sim_time: 1.5
      # 采样轨迹的空间/角度步长；越小越精细，但计算量越高。
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.2
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true
      critics: ["RotateToGoal", "Oscillation", "BaseObstacle", "GoalAlign", "PathAlign", "PathDist", "GoalDist"]
      # critic scale 是 DWB 轨迹评分权重，不是米制距离或安全阈值。
      BaseObstacle.scale: 0.02
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

# ---------- 全局规划：地图与目标 -> 全局路径 ----------
planner_server:
  ros__parameters:
    use_sim_time: false
    # 行为树以 1 Hz 重规划；2 Hz 预期上限可及时响应新障碍，又不会在 RK3588 上让
    # 全局搜索与 5 Hz 局部代价地图争抢 CPU。
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.5
      use_astar: false
      # 建图过程中允许穿过尚未探索区域，否则前沿目标可能无路可达。
      allow_unknown: true

# ---------- 恢复行为服务器：供行为树按需调用 ----------
behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "drive_on_heading", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    drive_on_heading:
      plugin: "nav2_behaviors::DriveOnHeading"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: odom
    global_frame: map
    robot_base_frame: base_link
    transform_tolerance: 0.2
    simulate_ahead_time: 2.0

# ---------- 行为树总调度：规划、跟踪、重规划与恢复 ----------
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odom
    default_nav_to_pose_bt_xml: "$(find-pkg-share slam)/behavior_trees/navigate_to_pose_wakula.xml"
    default_nav_through_poses_bt_xml: "$(find-pkg-share nav2_bt_navigator)/behavior_trees/navigate_through_poses_w_replanning_and_recovery.xml"
    # 必须覆盖自定义 BT 中所有 error_code_id 黑板键。显式登记后，导航结果会按正确
    # 优先级汇总规划、跟踪、后退和旋转错误，也不再依赖 Nav2 的两个默认键。
    error_code_names:
      - compute_path_error_code
      - follow_path_error_code
      - backup_error_code
      - spin_error_code

# ---------- 速度平滑：/cmd_vel_nav -> /cmd_vel_smoothed ----------
velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: "OPEN_LOOP"
    # [x, y, yaw]；当前基线禁止横移，避免假设未知四足底盘支持全向速度。
    max_velocity: [0.5, 0.0, 0.8]
    min_velocity: [-0.3, 0.0, -0.8]
    max_accel: [0.5, 0.0, 1.0]
    max_decel: [-0.5, 0.0, -1.0]
    odom_topic: /odom
    odom_duration: 0.1
    velocity_timeout: 1.0
    deadband_velocity: [0.0, 0.0, 0.0]
    enable_stamped_cmd_vel: false

# ---------- 局部代价地图：实时雷达 + 点云前向障碍 ----------
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 5.0
      publish_frequency: 2.0
      width: 4
      height: 4
      resolution: 0.05
      robot_radius: 0.30
      # 真机外形确定后应改为实测 footprint；圆半径只是硬件无关占位值。
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan terrain_points
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          obstacle_max_range: 3.0
          raytrace_max_range: 3.5
        terrain_points:
          topic: /perception/obstacle_points
          data_type: "PointCloud2"
          # 上游已按局部地面平面删除地面/坡面，只保留相对地面凸起。这里的 z 是
          # base_link 坐标而非离地高度；四足机身高于地面，低台阶的 z 常为负数，
          # 因此不能沿用正的 min_obstacle_height，否则会静默漏检低矮障碍。
          # 点云只标障不清障，避免稀疏深度帧把 2D 激光确认的障碍错误清除。
          clearing: false
          marking: true
          min_obstacle_height: -0.50
          max_obstacle_height: 0.80
          obstacle_max_range: 1.50
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        # 默认 10.0 只在障碍边缘留下很窄的代价带，Navfn 会选择从杆间斜穿，DWB 到
        # 近处才发现没有稳健轨迹。较缓的 3.0 提前惩罚贴杆路径，但不改变 lethal 边界。
        # 真机窄通道过不去时，先核对实测 footprint，再以 0.5 为步长向上调本值。
        cost_scaling_factor: 3.0

# ---------- 全局代价地图：静态 SLAM 地图 + 2D 激光动态标障 ----------
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_link
      update_frequency: 1.0
      publish_frequency: 1.0
      resolution: 0.05
      robot_radius: 0.30
      track_unknown_space: true
      # 在线探索时 SLAM 地图边界会紧贴最近激光端点。滚动窗口始终覆盖机器人附近，
      # 避免越障落点仅越出旧地图几厘米就让全局代价地图永久报 out of bounds。
      # 16 m × 8 m 覆盖当前 14 m × 6 m 比赛场，同时只以 1 Hz 更新以控制 RK3588 开销。
      rolling_window: true
      width: 16
      height: 8
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        # 后启动的 Nav2 也能收到 SLAM Toolbox 最近发布的地图。
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        inflation_radius: 0.45
        cost_scaling_factor: 3.0

# ---------- Wakula 自定义输入健康检查 ----------
navigation_health_monitor:
  ros__parameters:
    global_frame: map
    base_frame: base_link
    sensor_timeout: 1.0
    minimum_scan_valid_ratio: 0.60
    # 拒绝空 frame、零角增量、视场过窄或采样数量异常的“有数据但不可建图”扫描。
    minimum_scan_samples: 90
    minimum_scan_field_of_view: 3.14
    expected_odom_frame: odom
    max_xy_covariance: 1.0
    max_odom_jump: 0.75
    # 单次跳变锁存，连续 3 个稳定里程计样本后才恢复导航健康。
    odom_jump_recovery_samples: 3
    future_stamp_tolerance: 0.10

# ---------- 满足 scan/odom/定位 TF 后才激活 Nav2 ----------
nav2_readiness_monitor:
  ros__parameters:
    global_frame: map
    base_frame: base_link
    scan_topic: /scan
    odom_topic: /odom
    sensor_timeout: 1.0
    future_stamp_tolerance: 0.10
    minimum_scan_valid_ratio: 0.60
    minimum_scan_samples: 90
    minimum_scan_field_of_view: 3.14
    max_xy_covariance: 1.0
    expected_odom_frame: odom
    # readiness 只通过该服务激活 Nav2；改命名空间时必须同步修改此绝对服务名。
    lifecycle_service: /lifecycle_manager_navigation/manage_nodes
    # 快速重启后 slam_toolbox 偶发停在 inactive；监控器只在 scan/odom 健康且
    # map TF 缺失时尝试 configure/activate，不会关闭或重置外部定位节点。
    recover_slam_toolbox: true
    slam_lifecycle_node: /slam_toolbox
    slam_recovery_period: 2.0
    slam_recovery_startup_grace: 4.0
