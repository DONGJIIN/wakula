name: ROS 2 Jazzy CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    container:
      image: rostooling/setup-ros-docker:ubuntu-noble-latest
    steps:
      - name: Build and test all Wakula packages
        uses: ros-tooling/action-ros-ci@v0.4
        with:
          target-ros2-distro: jazzy
          package-name: >-
            quadruped_interfaces quadruped_description quadruped_perception
            quadruped_planning quadruped_bringup quadruped_tools
            quadruped_teleop quadruped_gazebo slam
          coverage-result: false
